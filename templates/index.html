<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex justify-center mt-20">

    <div class="border-2 border-black rounded-xl p-10 text-center">

        <h1 class="text-3xl font-bold mb-8">
            QR Code Generator
        </h1>

        <form id="qr-form">

            <input
                type="text"
                id="urlInput"
                placeholder="Enter your URL"
                required
                class="border border-gray-400 p-3 rounded"
            >

            <button
                type="submit"
                class="bg-blue-500 text-white px-5 py-3 rounded"
            >
                Generate QR Code
            </button>

        </form>

        <div id="qrResult" class="mt-6"></div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
